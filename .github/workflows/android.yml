name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach the APK to tagged releases

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.PIIK_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Build Piik engine, capture shim and cloudflared
        run: scripts/build-native.sh

      - name: Release signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.PIIK_KEYSTORE_BASE64 }}
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PIIK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          PIIK_KEYSTORE_PASSWORD: ${{ secrets.PIIK_KEYSTORE_PASSWORD }}
          PIIK_KEY_ALIAS: ${{ secrets.PIIK_KEY_ALIAS }}
          PIIK_KEY_PASSWORD: ${{ secrets.PIIK_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            # Surface the real errors as annotations (visible without opening raw logs).
            grep -E "^e: |error:|What went wrong|^> |Caused by|FAILED|Exception" gradle.log | grep -v "^> Task" | head -30 | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
          fi
          exit $status

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk piik-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: piik-android-apk
          path: piik-android.apk

      # Every build on main becomes a downloadable release (handy from a phone).
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Piik for Android (build {0})', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: Download **piik-android.apk** below and open it on your phone to install.
          files: piik-android.apk
